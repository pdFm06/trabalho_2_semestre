services: 
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: Projeto2Ano
      POSTGRES_PASSWORD: 4N^iT9qNyRBLcHNvhFOw7H*oAB!1mU
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    #verifica se o postgres esta pronto antes de arrancar o backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Projeto2Ano -d db"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: Projeto2Ano@gmail.com
      PGADMIN_DEFAULT_PASSWORD: 4N^iT9qNyRBLcHNvhFOw7H*oAB!1mU
    ports:
      - "5080:80"
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend/public:/usr/share/nginx/html

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    #o backend só arranca depois do postgres estar completamente pronto
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started

    environment:
      DATABASE_URL: postgresql://Projeto2Ano:4N^iT9qNyRBLcHNvhFOw7H*oAB!1mU@db:5432/db
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio123
      JWT_SECRET_KEY: dev-only-change-this-secret-key-before-production
      JWT_ALGORITHM: HS256
      KEYSERVER_INTERNAL_URL: http://keyserver:9000

  keydb:
    image: postgres:16
    environment:
      POSTGRES_DB: keydb
      POSTGRES_USER: keyuser
      POSTGRES_PASSWORD: keypassword
    volumes:
      - keydb_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keyuser -d keydb"]
      interval: 5s
      timeout: 5s
      retries: 10

  keyserver:
    build: ./keyserver
    ports:
      - "9002:9000"
    depends_on:
      keydb:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql://keyuser:keypassword@keydb:5432/keydb
      JWT_SECRET_KEY: dev-only-change-this-secret-key-before-production
      JWT_ALGORITHM: HS256

  minio:
    image: minio/minio
    # platform: linux/arm64 é necessário para correr no Mac com Apple Silicon (M1/M2/M3)
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
  keydb_data: