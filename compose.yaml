services: 
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: Projeto2Ano
      POSTGRES_PASSWORD: 4N^iT9qNyRBLcHNvhFOw7H*oAB!1mU
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    # verifica se o postgres esta pronto antes de arrancar o backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Projeto2Ano -d db"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: Projeto2Ano@gmail.com
      PGADMIN_DEFAULT_PASSWORD: 4N^iT9qNyRBLcHNvhFOw7H*oAB!1mU
    ports:
      - "5080:80"
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend/public:/usr/share/nginx/html

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    # O backend só arranca depois do Postgres estar pronto.
    # As instâncias MinIO têm retry no código Python, porque service_started
    # não garante que o serviço S3 já esteja pronto para receber pedidos.
    depends_on:
      db:
        condition: service_healthy
      minio1:
        condition: service_started
      minio2:
        condition: service_started
      minio3:
        condition: service_started

    environment:
      DATABASE_URL: postgresql://Projeto2Ano:4N^iT9qNyRBLcHNvhFOw7H*oAB!1mU@db:5432/db
      JWT_SECRET_KEY: dev-only-change-this-secret-key-before-production
      JWT_ALGORITHM: HS256
      KEYSERVER_INTERNAL_URL: http://keyserver:9000

      # Três nós MinIO independentes. Cada nó tem apenas um bucket.
      # Em produção, estes endpoints poderiam estar em servidores/redes diferentes.
      MINIO_1_ENDPOINT: minio1:9000
      MINIO_1_ACCESS_KEY: minio1
      MINIO_1_SECRET_KEY: minio123
      MINIO_1_BUCKET: cloud-part-1

      MINIO_2_ENDPOINT: minio2:9000
      MINIO_2_ACCESS_KEY: minio2
      MINIO_2_SECRET_KEY: minio123
      MINIO_2_BUCKET: cloud-part-2

      MINIO_3_ENDPOINT: minio3:9000
      MINIO_3_ACCESS_KEY: minio3
      MINIO_3_SECRET_KEY: minio123
      MINIO_3_BUCKET: cloud-part-3

      MINIO_SECURE: "false"

  keydb:
    image: postgres:16
    environment:
      POSTGRES_DB: keydb
      POSTGRES_USER: keyuser
      POSTGRES_PASSWORD: keypassword
    volumes:
      - keydb_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keyuser -d keydb"]
      interval: 5s
      timeout: 5s
      retries: 10

  keyserver:
    build: ./keyserver
    ports:
      - "9002:9000"
    depends_on:
      keydb:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql://keyuser:keypassword@keydb:5432/keydb
      JWT_SECRET_KEY: dev-only-change-this-secret-key-before-production
      JWT_ALGORITHM: HS256

  minio1:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio1
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio1_data:/data

  minio2:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio2
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - minio2_data:/data

  minio3:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio3
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9020:9000"
      - "9021:9001"
    volumes:
      - minio3_data:/data

volumes:
  postgres_data:
  minio1_data:
  minio2_data:
  minio3_data:
  keydb_data:
