services: 
  # Base de dados principal da aplicação.
  db:
    image: postgres:16
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Interface administrativa opcional para consultar as bases de dados.
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL:    ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    #ports:
      #- "5080:80"
    depends_on:
      - db

  # Servidor web que disponibiliza a interface HTML/CSS/JavaScript.
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend/public:/usr/share/nginx/html

  # API principal responsável por autenticação, ficheiros, pastas e MinIO.
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      minio1:
        condition: service_started
      minio2:
        condition: service_started
      minio3:
        condition: service_started
    environment:
      DATABASE_URL:           ${DATABASE_URL}
      JWT_SECRET_KEY:         ${JWT_SECRET_KEY}
      JWT_ALGORITHM:          ${JWT_ALGORITHM}
      KEYSERVER_INTERNAL_URL: ${KEYSERVER_INTERNAL_URL}

      SMTP_HOST:                  ${SMTP_HOST}
      SMTP_PORT:                  ${SMTP_PORT}
      SMTP_USERNAME:              ${SMTP_USERNAME}
      SMTP_PASSWORD:              ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL:            ${SMTP_FROM_EMAIL}
      SMTP_FROM_NAME:             ${SMTP_FROM_NAME:-Cloud Segura}
      SMTP_USE_TLS:               ${SMTP_USE_TLS:-false}
      SMTP_USE_STARTTLS:          ${SMTP_USE_STARTTLS:-true}
      SMTP_TIMEOUT_SECONDS:       ${SMTP_TIMEOUT_SECONDS:-15}
      SMTP_REQUIRE_REAL_DELIVERY: "true"
      EMAIL_RETURN_CODES:         "false"

      MINIO_1_ENDPOINT:   ${MINIO_1_ENDPOINT}
      MINIO_1_ACCESS_KEY: ${MINIO_1_ACCESS_KEY}
      MINIO_1_SECRET_KEY: ${MINIO_1_SECRET_KEY}
      MINIO_1_BUCKET:     ${MINIO_1_BUCKET}

      MINIO_2_ENDPOINT:   ${MINIO_2_ENDPOINT}
      MINIO_2_ACCESS_KEY: ${MINIO_2_ACCESS_KEY}
      MINIO_2_SECRET_KEY: ${MINIO_2_SECRET_KEY}
      MINIO_2_BUCKET:     ${MINIO_2_BUCKET}

      MINIO_3_ENDPOINT:   ${MINIO_3_ENDPOINT}
      MINIO_3_ACCESS_KEY: ${MINIO_3_ACCESS_KEY}
      MINIO_3_SECRET_KEY: ${MINIO_3_SECRET_KEY}
      MINIO_3_BUCKET:     ${MINIO_3_BUCKET}

      MINIO_SECURE: "false"

  # Base de dados usada exclusivamente pelo keyserver.
  keydb:
    image: postgres:16
    environment:
      POSTGRES_DB:       ${KEYDB_DB}
      POSTGRES_USER:     ${KEYDB_USER}
      POSTGRES_PASSWORD: ${KEYDB_PASSWORD}
    volumes:
      - keydb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYDB_USER} -d ${KEYDB_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Serviço responsável por guardar e devolver chaves de ficheiros cifradas.
  keyserver:
    build: ./keyserver
    ports:
      - "9002:9000"
    depends_on:
      keydb:
        condition: service_healthy
    environment:
      DATABASE_URL:   ${KEYDB_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM:  ${JWT_ALGORITHM}

  # Primeira instância MinIO, responsável por uma parte de cada ficheiro.
  minio1:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_1_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_1_SECRET_KEY}
    volumes:
      - minio1_data:/data

  # Segunda instância MinIO, responsável por uma parte de cada ficheiro.
  minio2:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_2_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_2_SECRET_KEY}
    volumes:
      - minio2_data:/data

  # Terceira instância MinIO, responsável por uma parte de cada ficheiro.
  minio3:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_3_SECRET_KEY}
    volumes:
      - minio3_data:/data

volumes:
  postgres_data:
  minio1_data:
  minio2_data:
  minio3_data:
  keydb_data:
