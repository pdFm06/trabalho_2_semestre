<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background-color:#f5f5f5;
            font-family: Arial, Helvetica, sans-serif;
        }

        .login-card{
            max-width:1200px;
            width:100%;
            border-radius:20px;
            overflow:hidden;
            background-color:white;
        }

        .left-side{
            background-color:#2563eb;
            color:white;
        }

        .logo-img{
            max-width:100%;
            max-height:300px;
            object-fit:contain;
        }

        .form-container{
            width:100%;
            max-width:450px;
        }

        .user-icon{
            width:80px;
            margin-bottom:20px;
        }

        .form-title{
            font-weight:bold;
            margin-bottom:5px;
        }

        .form-subtitle{
            color:#6c757d;
            margin-bottom:30px;
        }

        .form-control{
            height:48px;
            border-radius:10px;
        }

        .register-btn{
            height:48px;
            border-radius:10px;
            font-weight:600;
        }   

        .login-link{
            text-decoration:none;
            font-weight:600;
        }

        @media (max-width: 992px){

            .left-side{
                text-align:center;
                padding:40px 20px !important;
            }

            .logo-img{
                max-height:220px;
            }
        }

    </style>
</head>

<body>

<section class="min-vh-100 d-flex align-items-center justify-content-center px-3 py-4">

    <div class="container">

        <div class="card login-card border-0 shadow-lg mx-auto">

            <div class="row g-0">

                <!-- LEFT -->
                <div class="col-lg-5 left-side d-flex flex-column justify-content-center align-items-center p-5">

                    <img 
                        src="../img/Logo.png"
                        alt="Logo"
                        class="logo-img mb-4"
                    >

                    <h2 class="text-center">
                        Criar conta
                    </h2>

                    <p class="text-center opacity-75">
                        Acesso aos ficheiros em qualquer lugar
                    </p>

                </div>

                <!-- RIGHT -->
                <div class="col-lg-7 bg-white d-flex align-items-center justify-content-center p-5">

                    <div class="form-container">

                        <div class="text-center">

                            <img 
                                src="../img/usericon.png"
                                alt="User Icon"
                                class="user-icon"
                            >

                            <h2 class="form-title">
                                Registo
                            </h2>

                            <p class="form-subtitle">
                                Criar conta
                            </p>

                        </div>

                        <div id="alertContainer" aria-live="polite"></div>

                        <form id="form">

                            <div class="mb-3">

                                <label for="email" class="form-label">
                                    Email
                                </label>

                                <input 
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    placeholder="Email"
                                    required
                                >

                            </div>

                            <div class="mb-3">

                                <label for="password" class="form-label">
                                    Password
                                </label>

                                <input 
                                    type="password"
                                    class="form-control"
                                    id="password"
                                    placeholder="Password"
                                    required
                                >

                            </div>

                            <div class="mb-4">

                                <label for="confirmPassword" class="form-label">
                                    Confirmar Password
                                </label>

                                <input 
                                    type="password"
                                    class="form-control"
                                    id="confirmPassword"
                                    placeholder="Confirmar Password"
                                    required
                                >

                            </div>

                            <button 
                                type="submit"
                                class="btn btn-primary register-btn w-100"
                            >
                                Criar conta
                            </button>

                        </form>

                        <div class="text-center mt-4">

                            <span class="text-secondary">
                                Já tem conta?
                            </span>

                            <a href="./login.html" class="login-link">
                                Entre aqui!
                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js?v=20260518-mfa"></script>
<script src="../js/bootstrap_alerts.js?v=20260518-mfa"></script>
<script src="../js/crypto_utils.js?v=20260518-mfa"></script>
<script src="../js/register.js?v=20260518-mfa"></script>
</body>
</html>
