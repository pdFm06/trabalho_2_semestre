<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <section class = "min-vh-100 d-flex align-items-center justify-content-center bg-page px-5 py-0">
        <div class = "container-fluid px-5">
            <div class = "card login-card border-0 shadow-lg overflow-hidden mx-auto mw-100 p-5 min-vh-75" style = "min-height: 80vh;" >
                <div class = "row gx-5 gy-3">
                    <div class = "col p-5">
                        <img src="../img/Logo.png" alt="Login Image" class="img-fluid h-100">
                    </div>
                    <div class = "col align-items-center d-flex">
                        <div class = "container d-flex justify-content-center align-items-center flex-column border border-gray rounded-5 pb-5">
                            <div class="row gx-0 border-top-5 border-gray p-3 align-items-center" style="max-width: 20%; border-top-left-radius:90%; border-top-right-radius:90%;">
                                <img src="../img/usericon.png" style="width:100%; transform: translateY(10px); position:relative; top:20px" alt="">
                            </div>
                            <form class = "w-75 mx-auto fs-4 border border-grey b-5 rounded-3 p-5 t-5" style="overflow:hidden"> 
                                <div class="row gx-0 mb-3 border border-gray p-3 rounded align-items-center" >
                                    <label for="inputEmail3" class="col-sm-3 col-form-label">Name</label>
                                    <div class="col-sm-9">
                                        <input type="text" class="form-control" id="inputEmail3">
                                    </div>
                                </div>
                                <div class="row gx-0 mb-3 border border-gray p-3 rounded align-items-center">
                                    <label for="inputPassword3" class="col-sm-3 col-form-label">Email</label>
                                    <div class="col-sm-9">
                                        <input type="email" class="form-control" id="inputPassword3">
                                    </div>
                                </div>
                                <div class="row gx-0 mb-3 border border-gray p-3 rounded align-items-center">
                                    <label for="inputPassword3" class="col-sm-3 col-form-label">Password</label>
                                    <div class="col-sm-9">
                                        <input type="password" class="form-control" id="inputPassword3">
                                    </div>
                                </div>
                                <div class="row gx-0 mb-3 border border-gray p-3 rounded align-items-center">
                                    <label for="inputPassword3" class="col-sm-3 col-form-label">Confirm Password</label>
                                    <div class="col-sm-9">
                                        <input type="password" class="form-control" id="inputPassword3">
                                    </div>
                                </div>
                                    <button type="submit" class="btn btn-primary d-block mx-auto px-5">Sign in</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
