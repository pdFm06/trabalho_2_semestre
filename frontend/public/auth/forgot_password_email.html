<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir password</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{ background-color:#f5f5f5; font-family:Arial, Helvetica, sans-serif; }
        .recover-card{ width:100%; max-width:500px; border-radius:20px; background-color:white; }
        .user-icon{ width:80px; margin-bottom:20px; }
        .form-title{ font-weight:bold; }
        .form-subtitle{ color:#6c757d; font-size:0.95rem; }
        .form-control{ height:48px; border-radius:10px; }
        .recover-btn{ height:48px; border-radius:10px; font-weight:600; }
    </style>
</head>

<body>
<section class="min-vh-100 d-flex align-items-center justify-content-center px-3">
    <div class="card recover-card border-0 shadow-lg p-5">
        <div class="text-center">
            <img src="../img/usericon.png" alt="User" class="user-icon">
            <h2 class="form-title">Redefinir password</h2>
            <p class="form-subtitle mb-4">
                Indique o email da conta para gerar um código temporário de confirmação.
            </p>
        </div>

        <div id="alertContainer" aria-live="polite"></div>
        <div id="devResetCodeBox" class="alert alert-warning d-none" role="alert"></div>

        <form id="passwordResetRequestForm">
            <div class="mb-4">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" placeholder="Email" required>
            </div>

            <button type="submit" class="btn btn-primary recover-btn w-100">Enviar código</button>
        </form>

        <div class="text-center mt-4">
            <a href="./login.html">Voltar ao login</a>
        </div>
    </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js?v=20260517-fix-register-cache"></script>
<script src="../js/bootstrap_alerts.js?v=20260517-fix-register-cache"></script>
<script src="../js/password_reset_request.js?v=20260517-fix-register-cache"></script>
</body>
</html>
