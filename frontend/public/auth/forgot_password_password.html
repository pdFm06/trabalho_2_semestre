<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <section class = "min-vh-100 d-flex align-items-center justify-content-center bg-page px-5 py-0">
            <div class = "card login-card border-0 shadow-lg overflow-hidden mx-auto mw-100 p-5 pt-3 rounded-5" >
                        <div class = "container d-flex justify-content-center align-items-center flex-column">
                            <div class="row gx-0 border-top-5 border-gray py-3 align-items-center" style="max-width: 20%; border-top-left-radius:90%; border-top-right-radius:90%;">
                                <img src="../img/usericon.png" style="width:100%; transform: translateY(10px); position:relative; top:20px" alt="">
                            </div>
                            <form class = "mx-auto fs-4 border border-grey b-5 rounded-3 p-3 pt-5"> 
                                <div class="row gx-0 mb-3 p-3 rounded align-items-center g-2" >
                                    <label for="inputEmail3" class="col-sm-4 col-form-label">Password</label>
                                    <div class="col-sm-8">
                                        <input type="email" class="form-control" id="inputEmail3">
                                    </div>
                                </div>
                                    <button type="submit" class="btn btn-primary d-block mx-auto px-5">Sign in</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
    </section>
