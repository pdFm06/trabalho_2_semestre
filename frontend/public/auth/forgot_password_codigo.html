<!DOCTYPE html>
<!-- Página forgot_password_codigo.html: estrutura HTML da interface correspondente. -->
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Código de verificação</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{ background-color:#f5f5f5; font-family:Arial, Helvetica, sans-serif; }
        .recover-card{ width:100%; max-width:500px; border-radius:20px; background-color:white; }
        .user-icon{ width:80px; margin-bottom:20px; }
        .form-title{ font-weight:bold; }
        .form-subtitle{ color:#6c757d; font-size:0.95rem; }
        .form-control{ height:48px; border-radius:10px; text-align:center; font-size:1.2rem; letter-spacing:4px; }
        .verify-btn{ height:48px; border-radius:10px; font-weight:600; }
    </style>
</head>

<body>
<section class="min-vh-100 d-flex align-items-center justify-content-center px-3">
    <div class="card recover-card border-0 shadow-lg p-5">
        <div class="text-center">
            <img src="../img/usericon.png" alt="User" class="user-icon">
            <h2 class="form-title">Código de verificação</h2>
            <p class="form-subtitle mb-4">Introduza o código de 6 dígitos enviado por email.</p>
        </div>

        <div id="alertContainer" aria-live="polite"></div>
        <div id="resetCodeHint" class="alert alert-info d-none" role="alert"></div>

        <form id="passwordResetVerifyForm">
            <div class="mb-4">
                <label for="code" class="form-label">Código</label>
                <input type="text" class="form-control" id="code" placeholder="000000" inputmode="numeric" maxlength="6" required>
            </div>

            <button type="submit" class="btn btn-primary verify-btn w-100">Verificar código</button>
        </form>

        <div class="text-center mt-4">
            <a href="./forgot_password_email.html">Pedir novo código</a>
        </div>
    </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js?v=20260517-fix-register-cache"></script>
<script src="../js/bootstrap_alerts.js?v=20260517-fix-register-cache"></script>
<script src="../js/password_reset_verify.js?v=20260517-fix-register-cache"></script>
</body>
</html>
