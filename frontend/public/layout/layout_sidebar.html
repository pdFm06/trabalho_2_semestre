<!--
    Fragmento da sidebar — NÃO é uma página completa.
    Carregado dinamicamente por layout.js e injetado no #sidebar-container.
    Caminhos relativos à raiz do site (onde fica main_page.html).
-->
<aside class="sidebar">
    <a class="logo" href="#" aria-label="Cloud"><img src="./img/Logo.png" height="100" alt="Logo"></a>

    <div class="px-3 pb-3">
        <button id="logoutButton" class="btn btn-outline-danger btn-sm w-100" type="button">
            Terminar sessão
        </button>
    </div>

    <ul class="menu">
        <li>
            <a href="#" onclick="window.setFavoriteFilter?.(false); window._favActive=false;">
                <img class="imagem_side_bar" src="./img/home_page/home.png" alt="Ícone de Início"> Início
            </a>
        </li>
        <li>
            <a href="#" onclick="window.setFavoriteFilter?.(false); window._favActive=false;">
                <img class="imagem_side_bar" src="./img/home_page/hdd.png" alt="Ícone de Cloud"> Drive
            </a>
            <div class="drive-sidebar-actions px-3 pb-2">
                <button id="sidebarCreateFolderBtn" class="btn btn-sm btn-outline-light w-100" type="button"
                        data-bs-toggle="modal" data-bs-target="#folderModal">
                    + Nova pasta
                </button>
            </div>
            <div id="sidebarFolderTree" class="sidebar-folder-tree px-2 pb-2">
                <div class="small text-muted px-2">A carregar pastas...</div>
            </div>
        </li>
        <li>
            <a href="#" class="sidebar-main-link" data-app-view-link="settings" onclick="window.showSettingsView?.();">
                <img class="imagem_side_bar" src="./img/home_page/settings.png" alt="Ícone de Definições"> Definições
            </a>
        </li>
        <li><hr class="separador_side"></li>
        <li>
            <a href="#" class="sidebar-main-link" data-app-view-link="space">
                <img class="imagem_side_bar" src="./img/home_page/cloud.png" alt="Ícone de Cloud"> Espaço
            </a>
        </li>
        <li class="storage">
            <div class="progress" role="progressbar"
                 aria-label="Espaço utilizado" aria-valuenow="0"
                 aria-valuemin="0" aria-valuemax="100">
                <div id="storageProgressBar" class="progress-bar barra_espaco" style="width:0%"></div>
            </div>
            <div id="storageUsedText" class="small sidebar-muted mt-1 px-1">A calcular...</div>
        </li>
    </ul>
</aside>
