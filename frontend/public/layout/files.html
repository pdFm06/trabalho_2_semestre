<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/index.css">
</head>
<body>

    <!-- Sidebar carregada dinamicamente por layout.js -->
    <div id="sidebar-container"></div>

    <!-- Conteúdo principal -->
    <main class="main-content">
        <!-- Topo -->
        <section class="top-bar">
            <div class="suggested-button">
                <span class="arrow">⌄</span>
                <span>Suggested files</span>
            </div>

            <div class="view-controls">
                <button id="btn-list" class="view-btn active">☰</button>
                <button id="btn-grid" class="view-btn">▦</button>
            </div>
        </section>

        <!-- Lista/Grid -->
        <section class="files-section">
            <div id="filesContainer" class="files-list">

                <div class="file-row">
                    <div class="file-name">
                        <img src="../img/main_page/pdf.png" alt="Documento">
                        <span class="file-title">Ficheiro 1.pdf</span>
                    </div>

                    <div class="file-date">
                        You opened · Nov 25, 2025
                    </div>

                    <div class="file-location">
                        My Drive
                    </div>

                    <div class="file-menu-container">
                        <div class="file-menu">⋮</div>

                        <div class="menu-dropdown">
                            <div class="menu-item">Excluir</div>
                            <div class="menu-item">Transferir</div>
                            <div class="menu-item">Partilhar</div>
                        </div>
                    </div>
                </div>

                <div class="file-row">
                    <div class="file-name">
                        <img src="../img/main_page/video.png" alt="Vídeo">
                        <span class="file-title">video.mp4</span>
                    </div>

                    <div class="file-date">
                        You opened · Oct 17, 2024
                    </div>

                    <div class="file-location">
                        Shared with me
                    </div>

                    <div class="file-menu-container">
                        <div class="file-menu">⋮</div>

                        <div class="menu-dropdown">
                            <div class="menu-item">Excluir</div>
                            <div class="menu-item">Transferir</div>
                            <div class="menu-item">Partilhar</div>
                        </div>
                    </div>
                </div>

            </div>

            <div class="view-more">
                <a href="#">View more</a>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="layout/layout.js"></script>
</body>
</html>
