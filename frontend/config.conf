server {
  listen 80;
  server_name localhost;

  server_tokens off;

  root /usr/share/nginx/html;
  index main_page.html;

  # Durante o desenvolvimento, evita que o browser use JavaScript antigo.
  # O bug do registo acontecia quando register.js/crypto_utils.js ficavam em cache
  # e o frontend enviava o pedido sem os campos derivados da recovery key.
  location ~* \.(?:html|js|css)$ {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
